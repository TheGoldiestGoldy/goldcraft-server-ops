name: Validate repository

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile tools
        run: python -m compileall -q tools automation
      - name: Check forbidden tracked file types
        run: |
          if git ls-files | grep -E '\.(jar|zip|7z|rar|mca|mcr|nbt|log|log\.gz)$'; then
            echo "Forbidden binary, world or raw-log file is tracked."
            exit 1
          fi
      - name: Check obvious secrets
        run: |
          matches="$(git grep -I -n -E '(rcon\.password=.+|token[=:].+|api[_-]?key[=:].+|-----BEGIN .*PRIVATE KEY-----)' -- ':!.github/workflows/validate.yml' | grep -v '\[redacted\]' || true)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo "Potential secret detected."
            exit 1
          fi
      - name: Check personal and machine identifiers
        run: |
          matches="$(git grep -I -n -E '([[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}|[[:xdigit:]]{8}-[[:xdigit:]]{4}-[1-5][[:xdigit:]]{3}-[89abAB][[:xdigit:]]{3}-[[:xdigit:]]{12}|<HOME>/run/media/[^ <]+)' -- ':!tools/sanitize_repository.py' ':!.github/workflows/validate.yml' || true)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo "Potential personal or machine identifier detected."
            exit 1
          fi
      - name: Reject private generated evidence
        run: |
          if git ls-files | grep -E '(^data/current-snapshot\.json$|lod-coverage.*\.(csv|html)|world-trim-preview.*\.(csv|json|png))$'; then
            echo "Raw snapshots and exact-coordinate evidence must remain outside the public repository."
            exit 1
          fi
