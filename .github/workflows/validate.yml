name: Validate public repository

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check forbidden tracked file types
        run: |
          if git ls-files | grep -E '\.(jar|zip|7z|rar|mca|mcr|nbt|log|log\.gz|db|sqlite3?)$'; then
            echo "Forbidden binary, world, database or raw-log file is tracked."
            exit 1
          fi

      - name: Check obvious secrets
        run: |
          matches="$(git grep -I -n -E '(rcon\.password=.+|token[=:].+|api[_-]?key[=:].+|-----BEGIN .*PRIVATE KEY-----)' -- ':!.github/workflows/validate.yml' | grep -v '\[redacted\]' || true)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo "Potential secret detected."
            exit 1
          fi

      - name: Check personal and machine identifiers
        run: |
          matches="$(git grep -I -n -E '([[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}|[[:xdigit:]]{8}-[[:xdigit:]]{4}-[1-5][[:xdigit:]]{3}-[89abAB][[:xdigit:]]{3}-[[:xdigit:]]{12}|/home/[^ <]+|/run/media/[^ <]+|[A-Za-z]:\\Users\\[^ <]+)' -- ':!.github/workflows/validate.yml' || true)"
          if [ -n "$matches" ]; then
            printf '%s\n' "$matches"
            echo "Potential personal or machine identifier detected."
            exit 1
          fi

      - name: Reject private operational evidence
        run: |
          if git ls-files | grep -E '(^data/|^automation/|^configs/|^tools/|lod-coverage.*\.(csv|html)|world-trim-preview.*\.(csv|json|png))'; then
            echo "Private operational evidence must remain outside the public repository."
            exit 1
          fi

      - name: Check whitespace
        run: git diff --check
